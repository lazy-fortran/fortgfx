name = "fortgfx"
version = "0.1.0"
license = "MIT"
author = "Christopher Albert"
maintainer = "albert@tugraz.at"
copyright = "Copyright 2026, Christopher Albert"
description = "Graphics in Fortran: Vulkan and Metal, CPU rasteriser and terminal cells"

[build]
# example/triangle needs glslc and a display; it builds with its own Makefile.
auto-executables = false
auto-examples = false
auto-tests = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[preprocess]
cpp.suffixes = ["f90"]

[features]
platform.macos.preprocess.cpp.macros = ["__APPLE__"]
platform.windows.preprocess.cpp.macros = ["_WIN32"]

[profiles]
default = ["platform"]
